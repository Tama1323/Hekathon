name: Real-Time Timeline & Checklist Auto-Updater

on:
  schedule:
    # Runs everyday at 00:00 WIB (17:00 UTC) and 12:00 WIB (05:00 UTC)
    - cron: '0 17 * * *'
    - cron: '0 5 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Tracker & Generate Assets
        run: python scripts/update_tracker.py

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/timeline_progress.svg
          if git diff --staged --quiet; then
            echo "No updates needed today."
          else
            git commit -m "chore(tracker): auto-update timeline progress & calendar [skip ci]"
            git push
          fi
